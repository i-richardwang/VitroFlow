services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        HEROUI_KEY: ${HEROUI_KEY:?HEROUI_KEY is required to build the workbench}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitroflow}:${POSTGRES_PASSWORD:-vitroflow}@postgres:5432/${POSTGRES_DB:-vitroflow}
      VITROFLOW_PASSWORD: ${VITROFLOW_PASSWORD:-}
      VITROFLOW_INFERENCE_WORKER_TOKEN: ${VITROFLOW_INFERENCE_WORKER_TOKEN:-}
      VITROFLOW_TRAINING_WORKER_TOKEN: ${VITROFLOW_TRAINING_WORKER_TOKEN:-}
      VITROFLOW_EXPORT_TOKEN: ${VITROFLOW_EXPORT_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitroflow}
      POSTGRES_DB: ${POSTGRES_DB:-vitroflow}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitroflow} -d ${POSTGRES_DB:-vitroflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
