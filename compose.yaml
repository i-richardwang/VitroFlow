services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile.web
      secrets:
        - heroui_key
    environment:
      VITROFLOW_PASSWORD: ${VITROFLOW_PASSWORD:-}
      VITROFLOW_INFERENCE_WORKER_TOKEN: ${VITROFLOW_INFERENCE_WORKER_TOKEN:-}
      VITROFLOW_TRAINING_WORKER_TOKEN: ${VITROFLOW_TRAINING_WORKER_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data

secrets:
  heroui_key:
    environment: HEROUI_KEY
