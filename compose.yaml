x-web-image: &web-image
  image: vitroflow-web
  build:
    context: .
    dockerfile: Dockerfile.web
    args:
      HEROUI_KEY: ${HEROUI_KEY:-}

x-storage-environment: &storage-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-vitroflow}:${POSTGRES_PASSWORD:-vitroflow}@postgres:5432/${POSTGRES_DB:-vitroflow}
  VITROFLOW_BLOB_ENDPOINT: http://rustfs:9000
  VITROFLOW_BLOB_BUCKET: ${BLOB_BUCKET:-vitroflow}
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-vitroflow}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-vitroflow}
  AWS_REGION: us-east-1

services:
  workbench:
    <<: *web-image
    restart: unless-stopped
    environment:
      <<: *storage-environment
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      VITROFLOW_ADMIN_EMAIL: ${VITROFLOW_ADMIN_EMAIL:-}
      VITROFLOW_ADMIN_PASSWORD: ${VITROFLOW_ADMIN_PASSWORD:-}
      VITROFLOW_INFERENCE_WORKER_TOKEN: ${VITROFLOW_INFERENCE_WORKER_TOKEN:-}
      VITROFLOW_TRAINING_WORKER_TOKEN: ${VITROFLOW_TRAINING_WORKER_TOKEN:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully

  maintenance:
    <<: *web-image
    restart: unless-stopped
    command: ["bun", "dist/maintenance.js"]
    environment: *storage-environment
    depends_on:
      workbench:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitroflow}
      POSTGRES_DB: ${POSTGRES_DB:-vitroflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vitroflow} -d ${POSTGRES_DB:-vitroflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4}
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-vitroflow}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-vitroflow}
    volumes:
      - rustfs:/data

  bucket:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:2.36.34@sha256:cf1f5e5741c33f3fee383296ba8045b96b9eb93c3de017be6688fb00356352d7}
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-vitroflow}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-vitroflow}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        endpoint=http://rustfs:9000
        bucket=${BLOB_BUCKET:-vitroflow}
        for attempt in $$(seq 1 30); do
          aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$bucket" 2>/dev/null && exit 0
          aws --endpoint-url "$$endpoint" s3api create-bucket --bucket "$$bucket" && exit 0
          sleep 2
        done
        echo "RustFS did not accept a bucket at $$endpoint" >&2
        exit 1
    depends_on:
      - rustfs

volumes:
  postgres:
  rustfs:
