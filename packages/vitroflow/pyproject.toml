[project]
name = "vitroflow"
version = "0.2.0"
description = "Prepare culture-dish photographs for a VitroFlow workbench"
readme = "README.md"
license = "MIT"
authors = [{ name = "Richard Wang" }]
keywords = ["plant-tissue-culture", "culture-dish", "photography", "focus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=5.0",
]

[project.scripts]
vitroflow = "vitroflow.cli:main"

[project.urls]
Repository = "https://github.com/i-richardwang/VitroFlow"
Issues = "https://github.com/i-richardwang/VitroFlow/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitroflow"]
