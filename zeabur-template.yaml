# yaml-language-server: $schema=https://schema.zeabur.app/template.json
#
# Deploys the VitroFlow server side only: the workbench, its Postgres, and its
# S3-compatible store. Inference and training workers hold the GPUs and stay
# outside Zeabur; point them at the deployed workbench with their own tokens.
#
# Prereq: the source repository is private, so install the Zeabur GitHub App on
# the repository owner and grant it access before the first deploy.
apiVersion: zeabur.com/v1
kind: Template
metadata:
    name: VitroFlow
spec:
    description: "VitroFlow workbench — the annotation and training control plane for plant tissue culture imagery, built from source with Postgres and a MinIO object store."
    tags:
        - AI
        - Vision
        - Tool
    readme: |-
        # VitroFlow

        The workbench is the single entry point for experiment photos, box
        annotation, dataset assembly, and training runs. Postgres holds the
        records; the MinIO bucket holds image and model-weight bytes.

        ## Services
        - **workbench** — built from `Dockerfile.web`, serves the UI, the agent
          API, and the MCP endpoint on port 3000
        - **postgres** — Postgres 18, the source of truth for records
        - **minio** — S3-compatible object store for immutable blobs

        Inference and training workers are not part of this template. They only
        make outbound calls, so run them next to their GPUs and give them
        `VITROFLOW_INFERENCE_WORKER_TOKEN` / `VITROFLOW_TRAINING_WORKER_TOKEN`
        set on the workbench.

        ## After deploying
        Bind your own domain to the workbench in its Networking tab; no domain is
        bound for you. It has to be the domain you gave as the workbench domain,
        because that value is the auth issuer.

        The workbench restarts until MinIO answers for the bucket, then migrates
        the database on first use and creates the administrator account from the
        email and password you supplied.

        `BETTER_AUTH_URL` is the origin browsers and MCP clients reach the
        workbench at; it is the OAuth issuer, so it must match the bound domain
        exactly, and it must be HTTPS. Change it from the workbench variables if
        you ever move the workbench to another domain.

        ## Documentation
        - GitHub: https://github.com/i-richardwang/VitroFlow
    resourceUsage:
        cpu: 1
        memory: 2048
    variables:
        - key: PUBLIC_DOMAIN
          type: STRING
          name: Workbench Domain
          description: "The full domain the workbench is served on, such as vitroflow.example.com. Bind it in the Networking tab after deploying. It is also the auth issuer and the MCP endpoint origin."
        - key: HEROUI_KEY
          type: STRING
          name: HeroUI Pro Key
          description: "Private component-registry credential. The Web build needs it; the built image does not retain it."
        - key: VITROFLOW_ADMIN_EMAIL
          type: STRING
          name: Administrator Email
          description: "Email of the first administrator account, created on first start."
        - key: VITROFLOW_ADMIN_PASSWORD
          type: STRING
          name: Administrator Password
          description: "Password of the first administrator account. At least 8 characters."
    services:
        - name: postgres
          icon: https://cdn.zeabur.com/marketplace/postgresql.svg
          template: PREBUILT
          spec:
            # `id: postgresql` is what marks this as the marketplace PostgreSQL,
            # which is how the dashboard offers its SQL tooling for the service.
            id: postgresql
            source:
                image: postgres:18
                command:
                    - docker-entrypoint.sh
                    - -c
                    - config_file=/etc/postgresql/postgresql.conf
            ports:
                - id: database
                  port: 5432
                  type: TCP
            volumes:
                - id: data
                  dir: /var/lib/postgresql/18/docker
            instructions:
                - title: Connection String
                  content: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${PORT_FORWARDED_HOSTNAME}:${DATABASE_PORT_FORWARDED_PORT}/${POSTGRES_DATABASE}
                - title: PostgreSQL Connect Command
                  content: psql "postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${PORT_FORWARDED_HOSTNAME}:${DATABASE_PORT_FORWARDED_PORT}/${POSTGRES_DATABASE}"
                - title: PostgresSQL password
                  content: ${POSTGRES_PASSWORD}
                  category: Credentials
            env:
                PGDATA:
                    default: /var/lib/postgresql/18/docker/pgdata
                    expose: false
                POSTGRES_CONNECTION_STRING:
                    default: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
                    expose: true
                POSTGRES_DATABASE:
                    default: ${POSTGRES_DB}
                    expose: true
                POSTGRES_DB:
                    default: vitroflow
                POSTGRES_HOST:
                    default: ${CONTAINER_HOSTNAME}
                    expose: true
                POSTGRES_PASSWORD:
                    default: ${PASSWORD}
                    expose: true
                POSTGRES_PORT:
                    default: ${DATABASE_PORT}
                    expose: true
                POSTGRES_USER:
                    default: root
                POSTGRES_USERNAME:
                    default: ${POSTGRES_USER}
                    expose: true
            configs:
                - path: /etc/postgresql/postgresql.conf
                  template: |
                    # https://github.com/postgres/postgres/blob/master/src/backend/utils/misc/postgresql.conf.sample
                    listen_addresses = '*'
                    max_connections = 256
                    shared_buffers = 256MB
                    dynamic_shared_memory_type = posix
                    max_wal_size = 1GB
                    min_wal_size = 80MB
                    log_timezone = 'UTC'
                    datestyle = 'iso, mdy'
                    timezone = 'UTC'
                    lc_messages = 'en_US.UTF-8'
                    lc_monetary = 'en_US.UTF-8'
                    lc_numeric = 'en_US.UTF-8'
                    lc_time = 'en_US.UTF-8'
                    default_text_search_config = 'pg_catalog.english'
                  permission: null
                  envsubst: null

        - name: minio
          icon: https://cdn.zeabur.com/marketplace/minio.svg
          template: PREBUILT
          spec:
            # `id: minio` is what marks this as the marketplace MinIO, which is how
            # the dashboard offers its object tooling for the service.
            id: minio
            source:
                image: quay.io/minio/minio:latest
                command:
                    - /bin/sh
                args:
                    - -c
                    - |
                      minio server /data --console-address :9090 &
                      MINIO_PID=$!
                      while ! curl -s http://localhost:9000/minio/health/live; do
                        echo 'Waiting for MinIO to start...'
                        sleep 1
                      done
                      sleep 5
                      mc alias set myminio http://localhost:9000 $MINIO_USERNAME $MINIO_PASSWORD
                      echo "Creating bucket '$MINIO_DEFAULT_BUCKET'"
                      mc mb --ignore-existing myminio/$MINIO_DEFAULT_BUCKET
                      wait $MINIO_PID
            ports:
                - id: web
                  port: 9000
                  type: HTTP
                - id: console
                  port: 9090
                  type: HTTP
            volumes:
                - id: data
                  dir: /data
            instructions:
                - title: Go to MinIO Console
                  content: ${MINIO_CONSOLE_URL}
                - title: Default Username (S3 Access Key ID)
                  content: ${MINIO_USERNAME}
                - title: Default Password (S3 Secret Access Key)
                  content: ${MINIO_PASSWORD}
                - title: Default Bucket
                  content: ${MINIO_DEFAULT_BUCKET}
            env:
                MINIO_BROWSER_REDIRECT:
                    default: "false"
                MINIO_CONSOLE_URL:
                    default: ${ZEABUR_CONSOLE_URL}
                    expose: true
                MINIO_DEFAULT_BUCKET:
                    default: vitroflow
                    expose: true
                MINIO_ENDPOINT:
                    default: http://${CONTAINER_HOSTNAME}:${WEB_PORT}
                    expose: true
                    readonly: true
                MINIO_PASSWORD:
                    default: ${MINIO_ROOT_PASSWORD}
                    expose: true
                MINIO_ROOT_PASSWORD:
                    default: ${PASSWORD}
                MINIO_ROOT_USER:
                    default: minio
                MINIO_USERNAME:
                    default: ${MINIO_ROOT_USER}
                    expose: true

        - name: workbench
          template: GIT
          dependencies:
            - postgres
            - minio
          spec:
            source:
                source: GITHUB
                repo: 1344507419
                branch: main
            ports:
                - id: web
                  port: 3000
                  type: HTTP
            instructions:
                - type: TEXT
                  title: Workbench
                  content: https://${PUBLIC_DOMAIN}
                - type: TEXT
                  title: Administrator Email
                  content: ${VITROFLOW_ADMIN_EMAIL}
                  category: Credentials
                - type: PASSWORD
                  title: Administrator Password
                  content: ${VITROFLOW_ADMIN_PASSWORD}
                  category: Credentials
            env:
                ZBPACK_DOCKERFILE_NAME:
                    default: web
                HEROUI_KEY:
                    default: ${HEROUI_KEY}
                PORT:
                    default: "3000"
                DATABASE_URL:
                    default: ${POSTGRES_CONNECTION_STRING}
                VITROFLOW_BLOB_ENDPOINT:
                    default: ${MINIO_ENDPOINT}
                VITROFLOW_BLOB_BUCKET:
                    default: ${MINIO_DEFAULT_BUCKET}
                AWS_ACCESS_KEY_ID:
                    default: ${MINIO_USERNAME}
                AWS_SECRET_ACCESS_KEY:
                    default: ${MINIO_PASSWORD}
                AWS_REGION:
                    default: us-east-1
                BETTER_AUTH_SECRET:
                    default: ${PASSWORD}
                BETTER_AUTH_URL:
                    default: https://${PUBLIC_DOMAIN}
                VITROFLOW_ADMIN_EMAIL:
                    default: ${VITROFLOW_ADMIN_EMAIL}
                VITROFLOW_ADMIN_PASSWORD:
                    default: ${VITROFLOW_ADMIN_PASSWORD}
