[project]
name = "vitroflow"
version = "0.1.0"
description = "Seed counting for petri-dish photographs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
yolo = [
  "ultralytics==8.4.129",
]

[project.scripts]
vitroflow = "vitroflow.cli:main"
vitroflow-inference-worker = "vitroflow.inference_worker:main"
vitroflow-training-worker = "vitroflow.training_worker:main"

[project.urls]
Repository = "https://github.com/i-richardwang/VitroFlow"
Issues = "https://github.com/i-richardwang/VitroFlow/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vitroflow"]

[tool.hatch.build.targets.wheel.force-include]
"configs/yolo26" = "vitroflow/resources/yolo26"

[tool.hatch.build.targets.sdist]
include = [
  "/configs",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/scripts",
  "/src/vitroflow",
  "/tests",
  "/uv.lock",
]
