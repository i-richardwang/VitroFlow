[project]
name = "vitroflow"
version = "0.1.0"
description = "Command-line client and native Worker runtime for a VitroFlow workbench"
readme = "docs/package.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Wang" }]
keywords = ["plant-tissue-culture", "seed-counting", "object-detection", "yolo", "worker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.25",
  "numpy>=2.0",
  "opencv-python-headless>=5.0",
]

[project.optional-dependencies]
yolo = [
  "ultralytics==8.4.131",
]

[project.scripts]
vitroflow = "vitroflow.cli:main"

[project.urls]
Repository = "https://github.com/i-richardwang/VitroFlow"
Issues = "https://github.com/i-richardwang/VitroFlow/issues"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not reference'"
markers = [
  "reference: requires the checksum-pinned private reference images",
]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["src/vitroflow"]

[tool.hatch.build.targets.sdist]
include = [
  "/configs",
  "/docs/package.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/scripts",
  "/src/vitroflow",
  "/tests",
  "/uv.lock",
]
